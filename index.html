<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prop WorkerApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16352b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f0; --card:#ffffff; --ink:#14221c; --muted:#4b5f56; --line:#c5d3cc;
  --head:#16352b; --head-ink:#f2fbf6;
  --go:#0a6b3a; --go-ink:#fff;
  --pause:#a85400; --pause-ink:#fff;
  --done:#1a47a8; --done-ink:#fff;
  --warn:#8a1c1c; --chip:#dcebe3;
  --live:#1fa855; --slow:#e0a100; --off:#c0392b;
  --r:14px;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a15; --card:#18271f; --ink:#eaf4ee; --muted:#9cb3a6; --line:#2f463a; --chip:#23382d;
        --head:#0b221a; --go:#2fb36b; --go-ink:#06190f; --pause:#f0a24a; --pause-ink:#1d0f00; --done:#7aa2ff; --done-ink:#071230; --warn:#ff8f8f;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.35;
  padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.hidden{display:none!important}

/* Login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:460px;margin:0 auto}
#login h1{font-size:34px;margin:0 0 4px;letter-spacing:-.5px}
#login p.sub{margin:0 0 28px;color:var(--muted)}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input.t,select.t,textarea.t{width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
textarea.t{min-height:84px;resize:vertical}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--done)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:12px 18px;border:0;border-radius:var(--r);
  font-weight:700;font-size:19px;cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--go);color:var(--go-ink)} .btn.pause{background:var(--pause);color:var(--pause-ink)}
.btn.done{background:var(--done);color:var(--done-ink)} .btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.sm{min-height:48px;font-size:16px;width:auto;padding:8px 16px}
.err{color:var(--warn);font-weight:700;margin-top:12px;min-height:24px}

/* Shell */
header.top{position:sticky;top:0;z-index:20;background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:10px;padding:10px 14px}
header.top .ttl{font-weight:700;font-size:19px;flex:1;min-width:0}
header.top .ttl small{display:block;font-weight:400;opacity:.8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px}
.live i{width:11px;height:11px;border-radius:50%;background:var(--off);display:block}
.live.ok i{background:var(--live);box-shadow:0 0 0 0 rgba(31,168,85,.7);animation:pulse 2s infinite}
.live.slow i{background:var(--slow)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,168,85,0)}100%{box-shadow:0 0 0 0 rgba(31,168,85,0)}}
@media (prefers-reduced-motion:reduce){.live.ok i{animation:none}}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:inherit;min-width:46px;min-height:46px;border-radius:12px;font-size:20px;cursor:pointer}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;min-height:66px;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 4px 0 var(--go)}
nav.tabs .badge{position:absolute;top:6px;right:28%;background:var(--pause);color:var(--pause-ink);font-size:12px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Cards */
.bar{display:flex;gap:10px;align-items:center;margin:2px 0 12px}
.bar h2{margin:0;font-size:22px;flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.live-card{border-color:var(--go);border-width:3px}
.card.paused-card{border-color:var(--pause);border-width:3px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0 0 2px;font-size:19px}
.meta{color:var(--muted);font-size:15px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--chip);margin:6px 6px 0 0}
.chip.go{background:var(--go);color:var(--go-ink)} .chip.pause{background:var(--pause);color:var(--pause-ink)} .chip.re{background:var(--done);color:var(--done-ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.lanes{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.lanes button{flex:0 0 auto;min-height:48px;padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.lanes button[aria-pressed=true]{background:var(--head);color:var(--head-ink);border-color:var(--head)}
details.run{margin-bottom:12px}
details.run>summary{list-style:none;cursor:pointer}
details.run>summary::-webkit-details-marker{display:none}
.acts{margin-top:10px;border-top:2px dashed var(--line);padding-top:8px}
.act{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .nm{font-weight:700} .act .ds{font-size:14px;color:var(--muted)}

/* Session overlay */
#session{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#session .inner{max-width:720px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom,0px))}
.big{background:var(--head);color:var(--head-ink);border-radius:var(--r);padding:16px;margin:12px 0}
.big .clock{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.05}
.big .st{font-weight:700;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.controls{display:grid;gap:10px;margin:12px 0}
.loc{display:flex;gap:8px}
.loc input{flex:1}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
.gate{border:3px solid var(--pause);border-radius:var(--r);padding:12px;margin:12px 0;background:var(--card)}

/* Scan */
.cam{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;max-height:56vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18% 14%;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;font-size:21px}
.reasons{display:grid;gap:8px}
.reasons button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;text-align:left;padding:10px 14px;cursor:pointer}
.reasons button[aria-pressed=true]{border-color:var(--pause);background:var(--pause);color:var(--pause-ink)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-weight:700;text-align:center;max-width:560px;margin:0 auto}
#toast.bad{background:var(--warn);color:#fff}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <h1>Prop WorkerApp</h1>
  <p class="sub">Propagation bay field console</p>
  <form id="loginForm" autocomplete="off" novalidate>
    <label class="f" for="u">User name</label>
    <input class="t" id="u" name="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="f" for="p">PIN</label>
    <input class="t" id="p" name="p" type="password" autocomplete="current-password">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn go" id="loginBtn" type="submit">Sign in</button>
  </form>
</section>

<!-- APP SHELL -->
<div id="app" class="hidden">
  <header class="top">
    <div class="ttl">Prop WorkerApp<small id="who"></small></div>
    <div class="live" id="live" role="status"><i></i><span id="liveTxt">Offline</span></div>
    <button class="iconbtn" id="logoutBtn" aria-label="Sign out" title="Sign out">&#x23FB;</button>
  </header>

  <main>
    <section id="v-sessions">
      <div class="bar"><h2>My sessions</h2><button class="btn ghost sm" id="refreshBtn">Refresh</button></div>
      <div id="sessionList"></div>
    </section>

    <section id="v-queue" class="hidden">
      <div class="bar"><h2>Work queue</h2></div>
      <div class="lanes" id="lanes" role="group" aria-label="Work lane"></div>
      <div id="queueList"></div>
    </section>

    <section id="v-scan" class="hidden">
      <div class="bar"><h2>Scan</h2></div>
      <div class="cam hidden" id="cam"><video id="vid" playsinline muted></video><div class="frame"></div><div class="msg" id="camMsg">Point at a tag, tray, bed or location code</div></div>
      <div style="display:grid;gap:10px;margin-top:12px">
        <button class="btn go" id="camBtn">Start camera</button>
        <label class="f" for="typed" style="margin:6px 0 0">Or type the code</label>
        <div class="loc"><input class="t" id="typed" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="R-… / S-… / GH-16"><button class="btn done sm" id="typedGo">Look up</button></div>
      </div>
      <div id="scanResult" style="margin-top:14px"></div>
    </section>

    <section id="v-log" class="hidden">
      <div class="bar"><h2>My completed work</h2></div>
      <div id="logList"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="sessions" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>Sessions<span class="badge hidden" id="sessBadge">0</span></button>
    <button role="tab" data-tab="queue" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Queue</button>
    <button role="tab" data-tab="scan" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>Scan</button>
    <button role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Done</button>
  </nav>
</div>

<!-- SESSION SCREEN -->
<section id="session" class="hidden" aria-label="Work session">
  <header class="top" style="margin:0 -0px">
    <button class="iconbtn" id="sBack" aria-label="Back to sessions">&#x2190;</button>
    <div class="ttl" id="sTitle">Session<small id="sSub"></small></div>
    <div class="live" id="live2"><i></i><span id="liveTxt2">Offline</span></div>
  </header>
  <div class="inner">
    <div class="big">
      <div class="meta" style="color:inherit;opacity:.85" id="sCrop"></div>
      <div class="clock" id="sClock">0:00:00</div>
      <div class="st" id="sState"></div>
    </div>
    <div class="card"><div class="nm" style="font-weight:700" id="sName"></div><div class="meta" id="sDesc"></div><div class="meta" id="sStage" style="margin-top:6px"></div></div>

    <div class="controls" id="sControls"></div>

    <div id="sForm">
      <div id="waveWrap" class="hidden"><label class="f" for="fWave">Wave</label><select class="t" id="fWave"></select></div>
      <label class="f" for="fLoc">Location</label>
      <div class="loc"><input class="t" id="fLoc" autocapitalize="characters" placeholder="Bed, bench or bay"><button class="btn ghost sm" id="locScan" type="button">Scan</button></div>

      <div class="gate hidden" id="qtyGate">
        <div style="font-weight:700;margin-bottom:6px">Count required to finish</div>
        <div class="grid2">
          <div><label class="f" for="fQty" style="margin-top:0">Quantity</label><input class="t" id="fQty" type="number" inputmode="decimal" min="0" step="any"></div>
          <div><label class="f" for="fUnit" style="margin-top:0">Unit</label><select class="t" id="fUnit"></select></div>
        </div>
      </div>

      <div class="grid2">
        <div><label class="f" for="fTemp">Temp (&deg;F)</label><input class="t" id="fTemp" type="number" inputmode="decimal"></div>
        <div><label class="f" for="fMoist">Media moisture</label><select class="t" id="fMoist"><option value="">&mdash;</option><option>Dry</option><option>Even</option><option>Wet</option></select></div>
      </div>
      <label class="f" for="fEquip">Equipment used</label><input class="t" id="fEquip" placeholder="Seeder, flat-filler, mist wand…">
      <label class="f" for="fInputs">Inputs applied</label><input class="t" id="fInputs" placeholder="Media bags, fertilizer, biocontrol…">
      <div class="grid2">
        <div><label class="f" for="fWorkers">Workers on task</label><input class="t" id="fWorkers" type="number" inputmode="numeric" min="1" value="1"></div>
        <div><label class="f" for="fOutcome">Outcome</label><select class="t" id="fOutcome"><option>OK</option><option>Partial</option><option>Issue found</option></select></div>
      </div>
      <label class="f" for="fNotes">Notes</label><textarea class="t" id="fNotes"></textarea>
    </div>
  </div>
</section>

<!-- Pause modal -->
<div class="modal hidden" id="pauseModal" role="dialog" aria-modal="true" aria-labelledby="pmT">
  <div class="sheet">
    <h3 id="pmT">Why are you pausing?</h3>
    <div class="reasons" id="reasons"></div>
    <div style="display:grid;gap:10px;margin-top:14px">
      <button class="btn pause" id="pmOk" disabled>Pause session</button>
      <button class="btn ghost" id="pmCancel">Keep working</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
/* ============================ CONFIG ============================ */
const CFG = {
  API_URL: "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE",   // Apps Script Web App /exec URL
  POLL_MS: 20000,
  SLOW_MS: 45000,
  PAUSE_REASONS: ["Equipment repair","Climate alarm or weather","Material shortage (media, seed, trays)","Waiting on germination chamber","Break","Safety stop"],
  UNITS: ["trays","cells","seeds","plants","bags","racks"],
  UNIT_BY_ACT: {"ACT-201":"trays","ACT-203":"trays","ACT-405":"trays","ACT-406":"cells","ACT-505":"trays","ACT-601":"trays","ACT-606":"racks"},
  LANES: [
    {id:"all",   label:"All work",        phases:[1,2,3,4,5,6]},
    {id:"sow",   label:"Media and sowing", phases:[1,2]},
    {id:"nurse", label:"Germination and grow-out", phases:[3,4]},
    {id:"ship",  label:"Hardening and delivery",   phases:[5,6]}
  ]
};

/* ============================ STATE ============================ */
const S = { token:null, me:null, data:null, tab:"sessions", lane:"all", lastOk:0, cur:null, pauseReason:null, busy:false, poll:null, tick:null, scanStream:null, scanOn:false };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================ API ============================ */
async function api(action, payload){
  const body = JSON.stringify(Object.assign({action, token:S.token, op_id:uid()}, payload||{}));
  let res;
  try{
    res = await fetch(CFG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
  }catch(e){ setLive(false); throw new Error("No connection. Check signal and try again."); }
  let j;
  try{ j = await res.json(); }catch(e){ setLive(false); throw new Error("Server sent an unreadable reply."); }
  if(j && j.code==="AUTH"){ doLogout(true); throw new Error("Session expired. Sign in again."); }
  if(!j || !j.ok) { throw new Error((j&&j.error)||"Request failed."); }
  S.lastOk = Date.now(); setLive(true);
  return j;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }

/* ============================ LIVE INDICATOR ============================ */
function setLive(ok){
  const age = Date.now()-S.lastOk;
  const state = !ok ? "off" : (age>CFG.SLOW_MS ? "slow":"ok");
  ["live","live2"].forEach((id,i)=>{
    const el=$(id); el.className="live "+(state==="off"?"":state);
    $(i?"liveTxt2":"liveTxt").textContent = state==="ok"?"Live":state==="slow"?"Slow":"Offline";
  });
}

/* ============================ AUTH ============================ */
function saveAuth(){ try{ sessionStorage.setItem("prop_auth",JSON.stringify({t:S.token,m:S.me})); }catch(e){} }
function loadAuth(){ try{ const a=JSON.parse(sessionStorage.getItem("prop_auth")||"null"); if(a&&a.t){S.token=a.t;S.me=a.m;return true;} }catch(e){} return false; }
$("loginForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const u=$("u").value.trim(), p=$("p").value;
  if(!u||!p){ $("loginErr").textContent="Enter your user name and PIN."; return; }
  $("loginBtn").disabled=true; $("loginErr").textContent="";
  try{
    const j = await api("login",{user:u,pin:p,device:navigator.userAgent.slice(0,120)});
    S.token=j.token; S.me=j.me; saveAuth(); $("p").value="";
    enterApp();
  }catch(e){ $("loginErr").textContent=e.message; }
  $("loginBtn").disabled=false;
});
function doLogout(expired){
  clearInterval(S.poll); clearInterval(S.tick); stopScan();
  if(!expired && S.token){ api("logout").catch(()=>{}); }
  S.token=null;S.me=null;S.data=null;S.cur=null; try{sessionStorage.removeItem("prop_auth");}catch(e){}
  $("session").classList.add("hidden"); $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  if(expired) $("loginErr").textContent="Session expired. Sign in again.";
}
$("logoutBtn").onclick=()=>doLogout(false);

/* ============================ BOOT ============================ */
function enterApp(){
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").textContent = S.me.name+" · "+S.me.role;
  buildLanes(); switchTab("sessions");
  refresh(true);
  clearInterval(S.poll); S.poll=setInterval(()=>{ if(!document.hidden) refresh(); },CFG.POLL_MS);
  clearInterval(S.tick); S.tick=setInterval(tick,1000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.token) refresh(); });

async function refresh(first){
  if(!S.token) return;
  try{
    const j = await api("state");
    S.data=j; renderAll();
    if(S.cur){ const live=findSession(S.cur); if(live) renderSession(); }
  }catch(e){ if(first||S.tab==="sessions") toast(e.message,true); }
}
$("refreshBtn").onclick=()=>refresh(true);

/* ============================ DATA HELPERS ============================ */
function findSession(id){ return (S.data&&S.data.sessions||[]).find(s=>s.session_id===id); }
function actRef(id){ return (S.data&&S.data.activities||[]).find(a=>a.activity_id===id)||{activity:id,description:"",requires_count:"N",phase:"",scope:""}; }
function phaseNum(a){ const m=/Phase\s+(\d)/.exec(a.phase||""); return m?+m[1]:0; }
function runById(id){ return (S.data&&S.data.runs||[]).find(r=>r.run_id===id); }
function myId(){ return S.me&&S.me.id; }
function isMine(s){ return s.started_by===myId() || s.assigned_to===myId(); }
function fmtHMS(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function activeSec(s){
  if(!s.started_at) return 0;
  const now=Date.now()+(S.data?S.data.skew||0:0);
  const st=Date.parse(s.started_at); let paused=(+s.paused_total_sec||0);
  if(s.status==="PAUSED" && s.pause_started_at) paused+=(now-Date.parse(s.pause_started_at))/1000;
  return (now-st)/1000-paused;
}
function uiStatus(s){ if(s.status==="PAUSED") return "PAUSED"; if(s.status==="IN_PROGRESS") return "IN_PROGRESS"; if(s.status==="OPEN" && s.started_by) return "IN_PROGRESS"; return "ASSIGNED"; }
function stageHint(run){
  const c=(S.data.crops||{})[run.crop_code]; if(!c||!run.sow_date_wave1) return "";
  const days=Math.floor((Date.now()-Date.parse(run.sow_date_wave1))/86400000);
  if(days<0) return "Wave 1 sows in "+(-days)+" day"+(days===-1?"":"s");
  const g=+c.germination_days||0,n=+c.nursery_days||0,h=+c.harden_days||0;
  if(days<=g) return "Day "+days+": germination (sprout check by day "+g+")";
  if(days<=g+n) return "Day "+days+": nursery grow-out";
  if(days<=g+n+h) return "Day "+days+": hardening off";
  return "Day "+days+": past hardening window";
}

/* ============================ RENDER ============================ */
function renderAll(){ renderSessions(); renderQueue(); renderBadge(); setLive(true); }
function renderBadge(){
  const n=(S.data.sessions||[]).filter(s=>isMine(s)).length, b=$("sessBadge");
  b.textContent=n; b.classList.toggle("hidden",!n);
}
function renderSessions(){
  const list=$("sessionList"); const all=S.data.sessions||[];
  const mine=all.filter(isMine), others=all.filter(s=>!isMine(s));
  const mgr = /manager|founder/i.test(S.me.role);
  let h="";
  if(!mine.length) h+='<div class="card empty">No sessions assigned to you.<br>Open the Queue tab to start work.</div>';
  mine.forEach(s=>h+=sessionCard(s));
  if(mgr && others.length){ h+='<div class="bar" style="margin-top:18px"><h2 style="font-size:18px">Other workers</h2></div>'; others.forEach(s=>h+=sessionCard(s,true)); }
  list.innerHTML=h;
}
function sessionCard(s,ro){
  const a=actRef(s.activity_id), run=runById(s.run_id)||{}, st=uiStatus(s);
  const re = s.assigned_to && s.started_by && s.assigned_to!==s.started_by;
  const cls = st==="IN_PROGRESS"?"live-card":st==="PAUSED"?"paused-card":"";
  const chip = st==="IN_PROGRESS"?'<span class="chip go">In progress</span>':st==="PAUSED"?'<span class="chip pause">Paused</span>':'<span class="chip">Assigned</span>';
  return '<div class="card '+cls+'"><div class="row"><div><h3>'+esc(a.activity)+'</h3><div class="meta">'+esc(s.run_id)+' · '+esc(run.crop_code||"")+' · wave '+esc(s.wave)+'</div><div class="meta">'+esc(s.location||"No location yet")+'</div>'+chip+(re?'<span class="chip re">Reassigned to you</span>':'')+'</div>'
   +'<div class="timer" data-sid="'+esc(s.session_id)+'">'+(st==="ASSIGNED"?"":fmtHMS(activeSec(s)))+'</div></div>'
   +(ro?'':'<div style="margin-top:10px"><button class="btn '+(st==="ASSIGNED"?"go":"done")+'" data-open="'+esc(s.session_id)+'">'+(st==="ASSIGNED"?"Open and start":"Return to session")+'</button></div>')+'</div>';
}
$("sessionList").addEventListener("click",e=>{ const b=e.target.closest("[data-open]"); if(b) openSession(b.dataset.open); });

function buildLanes(){
  const saved=localStorage.getItem("prop_lane_"+myId()); if(saved) S.lane=saved;
  $("lanes").innerHTML=CFG.LANES.map(l=>'<button data-lane="'+l.id+'" aria-pressed="'+(S.lane===l.id)+'">'+esc(l.label)+'</button>').join("");
}
$("lanes").addEventListener("click",e=>{ const b=e.target.closest("[data-lane]"); if(!b)return; S.lane=b.dataset.lane; localStorage.setItem("prop_lane_"+myId(),S.lane); buildLanes(); renderQueue(); });

function renderQueue(){
  const lane=CFG.LANES.find(l=>l.id===S.lane)||CFG.LANES[0]; const runs=S.data.runs||[];
  let h="";
  runs.forEach(r=>{
    const acts=(r.pending||[]).map(id=>({id,a:actRef(id)})).filter(x=>lane.phases.includes(phaseNum(x.a)));
    if(!acts.length) return;
    const c=(S.data.crops||{})[r.crop_code]||{};
    h+='<details class="card run"><summary><div class="row"><div><h3>'+esc(c.crop_name||r.crop_code)+' <span class="meta">('+esc(r.crop_code)+')</span></h3><div class="meta">'+esc(r.run_id)+' · platform '+esc(r.platform)+' · '+esc(r.waves)+' wave'+(+r.waves===1?"":"s")+' · '+esc(r.trays_per_wave)+' trays/wave</div><div class="meta">'+esc(stageHint(r))+'</div></div><span class="chip">'+acts.length+' to do</span></div></summary>'
      +'<div class="acts">'+acts.map(x=>'<div class="act"><div><div class="nm">'+esc(x.a.activity)+(x.a.requires_count==="Y"?' <span class="chip">count</span>':'')+'</div><div class="ds">'+esc(x.a.description)+'</div></div><button class="btn go sm" data-start="'+esc(r.run_id)+'|'+esc(x.id)+'">Start</button></div>').join("")+'</div></details>';
  });
  $("queueList").innerHTML = h || '<div class="card empty">Nothing waiting in this lane.</div>';
}
$("queueList").addEventListener("click",async e=>{
  const b=e.target.closest("[data-start]"); if(!b) return;
  const [run_id,activity_id]=b.dataset.start.split("|"); await startWork(run_id,activity_id,b);
});

async function renderLog(){
  const box=$("logList"); box.innerHTML='<div class="card empty">Loading…</div>';
  try{
    const j=await api("history");
    box.innerHTML = (j.rows||[]).length ? j.rows.map(r=>'<div class="card"><div class="row"><div><h3>'+esc(r.activity_name)+'</h3><div class="meta">'+esc(r.run_id)+' · '+esc(r.crop_code)+' · wave '+esc(r.wave)+'</div><div class="meta">'+esc(r.location||"")+'</div></div><div class="timer">'+esc(Math.round(r.duration_min||0))+' min</div></div>'
      +(r.quantity!==""&&r.quantity!=null?'<span class="chip">'+esc(r.quantity)+' '+esc(r.unit||"")+'</span>':'')+'<span class="chip">'+esc(r.outcome||"")+'</span><div class="meta" style="margin-top:6px">'+esc(fmtDT(r.closed_at))+'</div></div>').join("")
      : '<div class="card empty">Finished work will appear here.</div>';
  }catch(e){ box.innerHTML='<div class="card empty">'+esc(e.message)+'</div>'; }
}
function fmtDT(s){ if(!s) return ""; const d=new Date(s); return isNaN(d)?s:d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }

/* ============================ TABS ============================ */
document.querySelector("nav.tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) switchTab(b.dataset.tab); });
function switchTab(t){
  S.tab=t;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  ["sessions","queue","scan","log"].forEach(v=>$("v-"+v).classList.toggle("hidden",v!==t));
  if(t!=="scan") stopScan();
  if(t==="log") renderLog();
  window.scrollTo(0,0);
}

/* ============================ SESSION LIFECYCLE ============================ */
async function startWork(run_id,activity_id,btn){
  if(S.busy) return; S.busy=true; if(btn) btn.disabled=true;
  try{
    const j=await api("start",{run_id,activity_id,wave:1});
    await refresh(); openSession(j.session_id); toast("Session started");
  }catch(e){ toast(e.message,true); }
  S.busy=false; if(btn) btn.disabled=false;
}

function openSession(id){
  const s=findSession(id); if(!s){ toast("That session is no longer open.",true); return; }
  S.cur=id; loadDraft(s); $("session").classList.remove("hidden"); document.body.style.overflow="hidden"; renderSession(true);
}
$("sBack").onclick=()=>{ saveDraft(); S.cur=null; $("session").classList.add("hidden"); document.body.style.overflow=""; refresh(); };

function renderSession(first){
  const s=findSession(S.cur); if(!s){ S.cur=null; $("session").classList.add("hidden"); document.body.style.overflow=""; return; }
  const a=actRef(s.activity_id), run=runById(s.run_id)||{}, st=uiStatus(s), c=(S.data.crops||{})[run.crop_code]||{};
  $("sTitle").firstChild.nodeValue=a.activity; $("sSub").textContent=s.session_id;
  $("sCrop").textContent=(c.crop_name||run.crop_code||"")+" · "+s.run_id+" · wave "+s.wave;
  $("sName").textContent=a.activity; $("sDesc").textContent=a.description||"";
  $("sStage").textContent=run.run_id?stageHint(run):"";
  $("sState").textContent = st==="IN_PROGRESS"?"In progress": st==="PAUSED"?("Paused: "+(s.pause_reason||"")):"Assigned: not started";
  const mine=isMine(s)||/manager|founder/i.test(S.me.role);
  const ctl=$("sControls");
  if(st==="ASSIGNED") ctl.innerHTML='<button class="btn go" id="cStart">Start</button>';
  else if(st==="PAUSED") ctl.innerHTML='<button class="btn go" id="cResume">Resume</button><button class="btn done" id="cDone">Complete</button>';
  else ctl.innerHTML='<button class="btn pause" id="cPause">Pause</button><button class="btn done" id="cDone">Complete</button>';
  ctl.querySelectorAll("button").forEach(b=>b.disabled=!mine);
  // wave picker for crop-wave scope
  const ww=$("waveWrap");
  if(a.scope==="crop-wave" && st==="ASSIGNED"){ ww.classList.remove("hidden"); const n=Math.max(1,+run.waves||1); $("fWave").innerHTML=Array.from({length:n},(_,i)=>'<option value="'+(i+1)+'"'+((+s.wave===i+1)?" selected":"")+'>Wave '+(i+1)+'</option>').join(""); }
  else ww.classList.add("hidden");
  // quantity gate
  const need=a.requires_count==="Y"; $("qtyGate").classList.toggle("hidden",!need);
  if(first){
    $("fUnit").innerHTML=CFG.UNITS.map(u=>'<option>'+u+'</option>').join("");
    $("fUnit").value=CFG.UNIT_BY_ACT[s.activity_id]||"trays";
    applyDraft(s);
    if(!$("fLoc").value && s.location) $("fLoc").value=s.location;
    if(!$("fLoc").value && run.suggested_location) $("fLoc").value=run.suggested_location;
  }
  updateClock();
}
function updateClock(){
  const s=findSession(S.cur); if(!s) return;
  $("sClock").textContent = uiStatus(s)==="ASSIGNED" ? "0:00:00" : fmtHMS(activeSec(s));
}
function tick(){
  updateClock();
  document.querySelectorAll(".timer[data-sid]").forEach(el=>{ const s=findSession(el.dataset.sid); if(s && uiStatus(s)!=="ASSIGNED") el.textContent=fmtHMS(activeSec(s)); });
  setLive(Date.now()-S.lastOk<CFG.SLOW_MS*3 && S.lastOk>0);
}

/* drafts keep form entries if the worker leaves and returns */
function draftKey(id){ return "prop_draft_"+id; }
function loadDraft(s){ /* read lazily in applyDraft */ }
function saveDraft(){
  if(!S.cur) return;
  const d={loc:$("fLoc").value,qty:$("fQty").value,unit:$("fUnit").value,temp:$("fTemp").value,moist:$("fMoist").value,equip:$("fEquip").value,inputs:$("fInputs").value,workers:$("fWorkers").value,outcome:$("fOutcome").value,notes:$("fNotes").value};
  try{ localStorage.setItem(draftKey(S.cur),JSON.stringify(d)); }catch(e){}
}
function applyDraft(s){
  let d={}; try{ d=JSON.parse(localStorage.getItem(draftKey(s.session_id))||"{}"); }catch(e){}
  $("fLoc").value=d.loc||""; $("fQty").value=d.qty||""; if(d.unit) $("fUnit").value=d.unit;
  $("fTemp").value=d.temp||""; $("fMoist").value=d.moist||""; $("fEquip").value=d.equip||""; $("fInputs").value=d.inputs||"";
  $("fWorkers").value=d.workers||"1"; $("fOutcome").value=d.outcome||"OK"; $("fNotes").value=d.notes||"";
}
$("sForm").addEventListener("input",saveDraft);

$("sControls").addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b||S.busy) return;
  const s=findSession(S.cur); if(!s) return;
  if(b.id==="cStart"){
    await act("start",{run_id:s.run_id,activity_id:s.activity_id,wave:$("waveWrap").classList.contains("hidden")?s.wave:+$("fWave").value,location:$("fLoc").value.trim()},"Session started");
  }else if(b.id==="cPause"){ openPause(); }
  else if(b.id==="cResume"){ await act("resume",{session_id:s.session_id},"Resumed"); }
  else if(b.id==="cDone"){ await complete(s); }
});
async function act(action,payload,okMsg){
  S.busy=true;
  try{
    const j=await api(action,payload); await refresh();
    if(j.session_id && j.session_id!==S.cur){ S.cur=j.session_id; }
    renderSession(false); toast(okMsg);
  }catch(e){ toast(e.message,true); }
  S.busy=false;
}

/* pause modal */
function openPause(){
  S.pauseReason=null; $("pmOk").disabled=true;
  $("reasons").innerHTML=CFG.PAUSE_REASONS.map(r=>'<button data-r="'+esc(r)+'" aria-pressed="false">'+esc(r)+'</button>').join("");
  $("pauseModal").classList.remove("hidden");
}
$("reasons").addEventListener("click",e=>{ const b=e.target.closest("[data-r]"); if(!b)return; S.pauseReason=b.dataset.r;
  $("reasons").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("pmOk").disabled=false; });
$("pmCancel").onclick=()=>$("pauseModal").classList.add("hidden");
$("pmOk").onclick=async()=>{
  if(!S.pauseReason) return; $("pauseModal").classList.add("hidden");
  await act("pause",{session_id:S.cur,reason:S.pauseReason},"Paused");
};

/* complete with quantity validation gate */
async function complete(s){
  const a=actRef(s.activity_id); const qty=$("fQty").value.trim(), unit=$("fUnit").value;
  if(a.requires_count==="Y"){
    const n=Number(qty);
    if(qty===""||!isFinite(n)||n<=0){ toast("Enter a quantity greater than 0 to finish.",true); $("fQty").focus(); return; }
    if(!unit){ toast("Choose a unit.",true); return; }
  }
  const w=parseInt($("fWorkers").value,10); if(!(w>=1)){ toast("Workers on task must be at least 1.",true); return; }
  if(!confirm("Finish "+a.activity+"? This saves the work to the permanent log.")) return;
  S.busy=true;
  try{
    await api("complete",{session_id:s.session_id,location:$("fLoc").value.trim(),quantity:a.requires_count==="Y"?Number(qty):"",unit:a.requires_count==="Y"?unit:"",
      temp_f:$("fTemp").value,soil_moisture:$("fMoist").value,equipment:$("fEquip").value.trim(),inputs_applied:$("fInputs").value.trim(),
      workers:w,outcome:$("fOutcome").value,notes:$("fNotes").value.trim()});
    try{ localStorage.removeItem(draftKey(s.session_id)); }catch(e){}
    S.cur=null; $("session").classList.add("hidden"); document.body.style.overflow="";
    await refresh(); toast("Work saved to the log");
  }catch(e){ toast(e.message,true); }
  S.busy=false;
}

/* ============================ SCANNING ============================ */
let detector=null, scanTarget="tab";
function hasBD(){ return "BarcodeDetector" in window; }
async function startScan(target){
  scanTarget=target||"tab";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast("Camera is not available here. Type the code instead.",true); return; }
  try{
    S.scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  }catch(e){ toast("Camera blocked. Allow camera access or type the code.",true); return; }
  const v=$("vid"); v.srcObject=S.scanStream; await v.play().catch(()=>{});
  $("cam").classList.remove("hidden"); $("camBtn").textContent="Stop camera"; S.scanOn=true;
  if(hasBD()){ try{ detector=new BarcodeDetector({formats:["qr_code","code_128","code_39","ean_13","data_matrix"]}); }catch(e){ detector=null; } }
  scanLoop();
}
function stopScan(){
  S.scanOn=false;
  if(S.scanStream){ S.scanStream.getTracks().forEach(t=>t.stop()); S.scanStream=null; }
  $("cam").classList.add("hidden"); $("camBtn").textContent="Start camera";
}
async function scanLoop(){
  if(!S.scanOn) return;
  const v=$("vid"); let code=null;
  try{
    if(detector){ const r=await detector.detect(v); if(r.length) code=r[0].rawValue; }
    else if(window.jsQR && v.videoWidth){
      const cv=scanLoop.cv||(scanLoop.cv=document.createElement("canvas")); const w=Math.min(640,v.videoWidth), h=Math.round(w*v.videoHeight/v.videoWidth);
      cv.width=w; cv.height=h; const x=cv.getContext("2d",{willReadFrequently:true}); x.drawImage(v,0,0,w,h);
      const im=x.getImageData(0,0,w,h); const q=jsQR(im.data,w,h); if(q) code=q.data;
    }
  }catch(e){}
  if(code){ stopScan(); handleCode(code); return; }
  setTimeout(scanLoop,detector?200:250);
}
$("camBtn").onclick=()=>{ S.scanOn?stopScan():startScan("tab"); };
$("typedGo").onclick=()=>{ const c=$("typed").value.trim(); if(c) handleCode(c); };
$("typed").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("typedGo").click(); }});
$("locScan").onclick=async()=>{
  if(S.scanOn){ stopScan(); return; }
  // quick in-session scan: uses a transient overlay video
  scanTarget="loc"; $("session").classList.add("hidden"); document.body.style.overflow=""; switchTab("scan"); startScan("loc");
};

async function handleCode(raw){
  const code=String(raw).trim(); $("typed").value=code;
  const box=$("scanResult"); box.innerHTML='<div class="card empty">Looking up '+esc(code)+'…</div>';
  try{
    const j=await api("resolve",{code});
    if(scanTarget==="loc"){
      scanTarget="tab";
      const loc=j.location||code; if(S.cur){ saveDraftLoc(loc); $("session").classList.remove("hidden"); document.body.style.overflow="hidden"; $("fLoc").value=loc; saveDraft(); }
      toast("Location set: "+loc); return;
    }
    let h='<div class="card"><h3>'+esc(j.title||code)+'</h3><div class="meta">'+esc(j.detail||"")+'</div>';
    if(j.session_id) h+='<div style="margin-top:10px"><button class="btn done" data-open="'+esc(j.session_id)+'">Return to session</button></div>';
    else if(j.run_id) h+='<div style="margin-top:10px"><button class="btn go" id="toRun" data-run="'+esc(j.run_id)+'">Show this run in the queue</button></div>';
    h+='</div>'; box.innerHTML=h;
  }catch(e){ box.innerHTML='<div class="card empty">'+esc(e.message)+'<br>Check the code and try again.</div>'; }
}
function saveDraftLoc(loc){ try{ const k=draftKey(S.cur); const d=JSON.parse(localStorage.getItem(k)||"{}"); d.loc=loc; localStorage.setItem(k,JSON.stringify(d)); }catch(e){} }
$("scanResult").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ switchTab("sessions"); openSession(o.dataset.open); return; }
  const r=e.target.closest("[data-run]"); if(r){ S.lane="all"; buildLanes(); switchTab("queue"); renderQueue();
    const d=[...document.querySelectorAll("#queueList details")].find(x=>x.textContent.includes(r.dataset.run)); if(d){ d.open=true; d.scrollIntoView({block:"center"}); } }
});

/* ============================ TOAST ============================ */
let tt; function toast(msg,bad){ const t=$("toast"); t.textContent=msg; t.className=bad?"bad":""; clearTimeout(tt); tt=setTimeout(()=>t.classList.add("hidden"),bad?4500:2200); }

/* ============================ INIT ============================ */
if(loadAuth()) enterApp(); else setLive(false);
</script>

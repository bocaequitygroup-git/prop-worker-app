<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prop WorkerApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16352b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f0; --card:#ffffff; --ink:#14221c; --muted:#4b5f56; --line:#c5d3cc;
  --head:#16352b; --head-ink:#f2fbf6;
  --go:#0a6b3a; --go-ink:#fff;
  --pause:#a85400; --pause-ink:#fff;
  --done:#1a47a8; --done-ink:#fff;
  --warn:#8a1c1c; --chip:#dcebe3;
  --live:#1fa855; --slow:#e0a100; --off:#c0392b;
  --r:14px;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a15; --card:#18271f; --ink:#eaf4ee; --muted:#9cb3a6; --line:#2f463a; --chip:#23382d;
        --head:#0b221a; --go:#2fb36b; --go-ink:#06190f; --pause:#f0a24a; --pause-ink:#1d0f00; --done:#7aa2ff; --done-ink:#071230; --warn:#ff8f8f;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.35;
  padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--done);outline-offset:2px}
.hidden{display:none!important}

/* Login */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:460px;margin:0 auto}
#login h1{font-size:34px;margin:0 0 4px;letter-spacing:-.5px}
#login p.sub{margin:0 0 28px;color:var(--muted)}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input.t,select.t,textarea.t{width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
textarea.t{min-height:84px;resize:vertical}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--done)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:12px 18px;border:0;border-radius:var(--r);
  font-weight:700;font-size:19px;cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--go);color:var(--go-ink)} .btn.pause{background:var(--pause);color:var(--pause-ink)}
.btn.done{background:var(--done);color:var(--done-ink)} .btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.sm{min-height:48px;font-size:16px;width:auto;padding:8px 16px}
.err{color:var(--warn);font-weight:700;margin-top:12px;min-height:24px}

/* Shell */
header.top{position:sticky;top:0;z-index:20;background:var(--head);color:var(--head-ink);display:flex;align-items:center;gap:10px;padding:10px 14px}
header.top .ttl{font-weight:700;font-size:19px;flex:1;min-width:0}
header.top .ttl small{display:block;font-weight:400;opacity:.8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px}
.live i{width:11px;height:11px;border-radius:50%;background:var(--off);display:block}
.live.ok i{background:var(--live);box-shadow:0 0 0 0 rgba(31,168,85,.7);animation:pulse 2s infinite}
.live.slow i{background:var(--slow)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,168,85,0)}100%{box-shadow:0 0 0 0 rgba(31,168,85,0)}}
@media (prefers-reduced-motion:reduce){.live.ok i{animation:none}}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:inherit;min-width:46px;min-height:46px;border-radius:12px;font-size:20px;cursor:pointer}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
#resume{position:fixed;left:0;right:0;z-index:45;display:flex;gap:10px;align-items:center;padding:10px 14px;min-height:56px;border:0;border-top:3px solid var(--ink);background:var(--go);color:var(--go-ink);font:inherit;font-weight:700;font-size:16px;text-align:left;cursor:pointer;width:100%}
#resume.paused{background:var(--pause);color:var(--pause-ink)}#resume b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#resume .go{white-space:nowrap}
body.hasresume main{padding-bottom:150px}body.hasresume #session .inner{padding-bottom:130px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;min-height:66px;font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 4px 0 var(--go)}
nav.tabs .badge{position:absolute;top:6px;right:28%;background:var(--pause);color:var(--pause-ink);font-size:12px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Cards */
.bar{display:flex;gap:10px;align-items:center;margin:2px 0 12px}
.bar h2{margin:0;font-size:22px;flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.live-card{border-color:var(--go);border-width:3px}
.card.paused-card{border-color:var(--pause);border-width:3px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{margin:0 0 2px;font-size:19px}
.meta{color:var(--muted);font-size:15px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--chip);margin:6px 6px 0 0}
.chip.go{background:var(--go);color:var(--go-ink)} .chip.pause{background:var(--pause);color:var(--pause-ink)} .chip.re{background:var(--done);color:var(--done-ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.lanes{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.lanes button{flex:0 0 auto;min-height:48px;padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.lanes button[aria-pressed=true]{background:var(--head);color:var(--head-ink);border-color:var(--head)}
details.run{margin-bottom:12px}
details.run>summary{list-style:none;cursor:pointer}
details.run>summary::-kit-details-marker{display:none}
.acts{margin-top:10px;border-top:2px dashed var(--line);padding-top:8px}
.act{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .nm{font-weight:700} .act .ds{font-size:14px;color:var(--muted)}

/* Session overlay */
#session{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
#session .inner{max-width:720px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom,0px))}
.big{background:var(--head);color:var(--head-ink);border-radius:var(--r);padding:16px;margin:12px 0}
.big .clock{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.05}
.big .st{font-weight:700;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.controls{display:grid;gap:10px;margin:12px 0}
.loc{display:flex;gap:8px}
.loc input,.loc select{flex:1;min-width:0}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
.hint.mvn{color:inherit;border:2px solid var(--pause-ink,#7a3000);background:var(--pause,#ffd8a6);border-radius:10px;padding:6px 10px;margin:8px 0 0;font-size:15px}
.gate{border:3px solid var(--pause);border-radius:var(--r);padding:12px;margin:12px 0;background:var(--card)}

/* Scan */
.cam{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;max-height:56vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18% 14%;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;font-size:21px}
.reasons{display:grid;gap:8px}
.reasons button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;text-align:left;padding:10px 14px;cursor:pointer}
.reasons button[aria-pressed=true]{border-color:var(--pause);background:var(--pause);color:var(--pause-ink)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-weight:700;text-align:center;max-width:560px;margin:0 auto}
#toast.bad{background:var(--warn);color:#fff}

.sc{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sc .cam{max-height:none;flex:1;border-radius:0;aspect-ratio:auto}
.sc .panel{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:var(--card);border-top:2px solid var(--line)}
.sc .ttl2{font-weight:700;font-size:19px}
.sc .found{max-height:96px;overflow:auto;font-size:15px}
.zone{border:3px solid var(--line);border-radius:var(--r);padding:12px;background:var(--card);margin:12px 0}
.zone.ok{border-color:var(--go)}
.zone .zl{font-weight:700;font-size:20px}
.lock{opacity:.8}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.trayrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <h1>Prop WorkerApp</h1>
  <p class="sub">Propagation bay field console</p>
  <form id="loginForm" autocomplete="off" novalidate>
    <label class="f" for="u">User name</label>
    <input class="t" id="u" name="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="f" for="p">PIN</label>
    <input class="t" id="p" name="p" type="password" autocomplete="current-password">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn go" id="loginBtn" type="submit">Sign in</button>
  </form>
</section>

<!-- APP SHELL -->
<div id="app" class="hidden">
  <header class="top">
    <div class="ttl">Prop WorkerApp<small id="who"></small></div>
    <div class="live" id="live" role="status"><i></i><span id="liveTxt">Offline</span></div>
    <button class="iconbtn" id="logoutBtn" aria-label="Sign out" title="Sign out">&#x23FB;</button>
  </header>

  <main>
    <section id="v-sessions">
      <div class="bar"><h2>My sessions</h2><button class="btn ghost sm" id="refreshBtn">Refresh</button></div>
      <div class="lanes" id="lanes" role="group" aria-label="Phase filter"></div>
      <div id="taskList"></div>
    </section>

    <section id="v-trays" class="hidden">
      <div class="bar"><h2>Move trays</h2></div>
      <div id="trayBox"></div>
    </section>

    <section id="v-floor" class="hidden">
      <div class="bar"><h2>On the floor</h2><button class="btn ghost sm" id="refreshBtn2">Refresh</button></div>
      <div id="floorList"></div>
    </section>

    <section id="v-log" class="hidden">
      <div class="bar"><h2>My finished work</h2></div>
      <div class="meta" style="margin:-6px 0 10px">Last 16 hours</div>
      <div id="logList"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="sessions" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>Sessions<span class="badge hidden" id="sessBadge">0</span></button>
    <button role="tab" data-tab="trays" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 6v12M15 6v12M3 12h18"/></svg>Trays</button>
    <button role="tab" data-tab="floor" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 15c3 0 6 1.6 6 5"/></svg>Floor</button>
    <button role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Done</button>
  </nav>
</div>

<button id="resume" class="hidden" type="button" aria-label="Back to your running session"></button>

<!-- SESSION SCREEN -->
<section id="session" class="hidden" aria-label="Work session">
  <header class="top">
    <button class="iconbtn" id="sBack" aria-label="Back to sessions">&#x2190;</button>
    <div class="ttl" id="sTitle">Session<small id="sSub"></small></div>
    <div class="live" id="live2"><i></i><span id="liveTxt2">Offline</span></div>
  </header>
  <div class="inner">
    <div class="big">
      <div class="meta" style="color:inherit;opacity:.85" id="sCrop"></div>
      <div class="clock" id="sClock">0:00:00</div>
      <div class="st" id="sState"></div>
    </div>
    <div class="card"><div style="font-weight:700" id="sName"></div><div class="meta" id="sDesc"></div><div id="sMove"></div><div class="meta" id="sTiming" style="margin-top:6px"></div></div>

    <div class="zone" id="zoneBox">
      <div class="meta">Work zone</div>
      <div class="zl" id="zoneLabel"></div>
      <div class="hint" id="zoneHint"></div>
      <div style="margin-top:10px"><button class="btn done sm" id="zoneScanBtn" type="button">Scan zone tag</button></div>
    </div>

    <div id="preForm" class="hidden">
      <div id="waveWrap" class="hidden"><label class="f" for="fWave">Wave</label><select class="t" id="fWave"></select></div>
    </div>

    <div class="controls" id="sControls"></div>

    <div id="sForm" class="hidden">
      <div class="gate hidden" id="qtyGate">
        <div style="font-weight:700;margin-bottom:6px">Count required to finish</div>
        <div class="grid2">
          <div><label class="f" for="fQty" style="margin-top:0">Quantity</label><input class="t" id="fQty" type="number" inputmode="decimal" min="0" step="any"></div>
          <div><label class="f" for="fUnit" style="margin-top:0">Unit</label><select class="t" id="fUnit"></select></div>
        </div>
      </div>
      <div class="grid2">
        <div><label class="f" for="fTemp">Temp (&deg;F)</label><input class="t" id="fTemp" type="number" inputmode="decimal"></div>
        <div><label class="f" for="fMoist">Media moisture</label><select class="t" id="fMoist"><option value="">&mdash;</option><option>Dry</option><option>Even</option><option>Wet</option></select></div>
      </div>
      <label class="f" for="fWeather">Weather</label>
      <select class="t" id="fWeather"><option value="">&mdash;</option><option>Clear</option><option>Cloudy</option><option>Rain</option><option>Hot</option><option>Cold</option><option>Windy</option></select>
      <label class="f" for="fInputs">Inputs applied</label><input class="t" id="fInputs" placeholder="Media bags, fertilizer, biocontrol…">
      <label class="f">How did it go?</label>
      <div class="seg" id="fFinish"><button type="button" data-v="yes" aria-pressed="true">Finished</button><button type="button" data-v="no" aria-pressed="false">Partial, more to do</button></div>
      <label class="f" for="fNotes">Notes</label><textarea class="t" id="fNotes"></textarea>
    </div>
    <div id="equipWrap"><label class="f" for="fEquip">Equipment used</label><input class="t" id="fEquip" placeholder="Seeder, flat-filler, mist wand…"></div>
  </div>
</section>

<!-- SCANNER -->
<section id="scanner" class="sc hidden" aria-label="Scanner">
  <div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="frame"></div><div class="msg" id="camMsg"></div></div>
  <div class="panel">
    <div class="ttl2" id="scTitle"></div>
    <div class="hint" id="scHint"></div>
    <div class="found hidden" id="scFound"></div>
    <div class="loc hidden" id="scTypedRow"><select class="t" id="scPick" aria-label="Choose the zone"></select><button class="btn done sm" id="scTypedGo" type="button">Use zone</button></div>
    <button class="btn ghost" id="scClose" type="button">Cancel</button>
  </div>
</section>

<!-- Pause modal -->
<div class="modal hidden" id="pauseModal" role="dialog" aria-modal="true" aria-labelledby="pmT">
  <div class="sheet">
    <h3 id="pmT">Why are you pausing?</h3>
    <div class="reasons" id="reasons"></div>
    <div id="stallNote" class="hidden"><label class="f" for="pmNote">What is stalled? The manager is alerted.</label><textarea class="t" id="pmNote"></textarea></div>
    <div style="display:grid;gap:10px;margin-top:14px">
      <button class="btn pause" id="pmOk" disabled>Pause session</button>
      <button class="btn ghost" id="pmCancel">Keep working</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
/* ============================ CONFIG ============================ */
const CFG = {
  API_URL: "https://script.google.com/macros/s/AKfycbz7qyhFT5BRUpiqLCnjtT8gRX-UQ-I0lQhF__H6dgCU_Rql2WFOMuNm-YLXazi0Zrir_g/exec",   // the same /exec URL as the board and dashboard (Code_pro.gs)
  APP: "prop_workerapp",
  POLL_MS: 20000,
  SLOW_MS: 45000,
  STALL: "Material/Equipment Stall",
  PAUSE_REASONS: ["Break","Lunch","Material/Equipment Stall","End of Day"],   // the four reasons wPause accepts
  UNITS: ["trays","cells","seeds","plants","bags","racks"],
  UNIT_BY_ACT: {"ACT-201":"trays","ACT-203":"trays","ACT-405":"trays","ACT-406":"cells","ACT-505":"trays","ACT-601":"trays","ACT-606":"racks"},
  LANES: [
    {id:"all",   label:"All work", phases:[0,1,2,3,4,5,6]},
    {id:"sow",   label:"Media and sowing", phases:[1,2]},
    {id:"nurse", label:"Germination and grow-out", phases:[3,4]},
    {id:"ship",  label:"Hardening and delivery", phases:[5,6]}
  ],
  QUEUEABLE: ["wPause","wResume","wClose","wTray","updateSession"]   // safe to repeat, so they can wait for signal
};

/* ============================ STATE ============================ */
const S = { token:null, me:null, data:null, skew:0, tab:"sessions", lane:"all", lastOk:0, cur:null, busy:false, poll:null, tick:null,
  hide:{}, zone:{}, pauseReason:null, stream:null, scanOn:false, sc:null, tray:{codes:[],bad:[],dest:null,cid:null,res:null} };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowMs = () => Date.now()+S.skew;

/* ============================ API ============================ */
class NetErr extends Error{ constructor(m){ super(m); this.net=true; } }
async function api(action, payload){
  const body = JSON.stringify(Object.assign({action, token:S.token}, payload||{}));
  let res;
  try{ res = await fetch(CFG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); }
  catch(e){ setLive(false); throw new NetErr("No connection. Check signal and try again."); }
  let j;
  try{ j = await res.json(); }catch(e){ setLive(false); throw new Error("Server sent an unreadable reply. Check the web app URL."); }
  if(j && j.error){
    if(/^AUTH/.test(j.error) && S.token){ doLogout(true); throw new Error("Session ended. Sign in again."); }
    throw new Error(String(j.error).replace(/^AUTH:\s*/,""));
  }
  S.lastOk = Date.now(); setLive(true);
  return j;
}

/* Outbox: pause, resume, close and tray moves wait here when there is no signal and carry their true tap time */
const obKey = () => "prop_outbox_"+(S.me?S.me.id:"x");
function obGet(){ try{ return JSON.parse(localStorage.getItem(obKey())||"[]"); }catch(e){ return []; } }
function obSet(a){ try{ localStorage.setItem(obKey(),JSON.stringify(a)); }catch(e){} setLive(S.lastOk>0&&Date.now()-S.lastOk<CFG.SLOW_MS*3); }
async function send(action, payload, optimistic){
  payload = Object.assign({at:nowMs()}, payload);
  try{ return await api(action,payload); }
  catch(e){
    if(e.net && CFG.QUEUEABLE.includes(action)){
      const q=obGet(); q.push({action,payload}); obSet(q); if(optimistic) optimistic();
      toast("No signal. Saved on this phone and will send automatically.");
      return {queued:true};
    }
    throw e;
  }
}
let flushing=false;
async function flushOutbox(){
  if(flushing) return; flushing=true;
  try{
    let q=obGet();
    while(q.length){
      try{ await api(q[0].action,q[0].payload); q.shift(); obSet(q); }
      catch(e){
        if(e.net) break;
        toast("A saved action was rejected: "+e.message,true); q.shift(); obSet(q);
      }
    }
    if(!obGet().length) S.hide={};
  } finally { flushing=false; }
}

const cfg = () => (S.data&&S.data.config)||{qrRequired:true,qrManual:false};
const typedOk = () => !cfg().qrRequired || cfg().qrManual;
function findTask(key){ return (S.data&&S.data.tasks||[]).find(t=>t.key===key); }
function phaseNum(t){ const m=/Phase\s+(\d)/.exec(t.phase||""); return m?+m[1]:0; }
function fmtHMS(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function netSec(s){
  let paused=+s.pausedSec||0; const n=nowMs();
  if(s.pausedAt) paused+=(n-Date.parse(s.pausedAt))/1000;
  return (n-Date.parse(s.startedAt))/1000-paused;
}
function fmtDT(ms){ const d=new Date(ms); return isNaN(d)?"":d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function fmtDue(s){ if(!s) return ""; const d=new Date(String(s).length<=10?s+"T12:00:00":s); return isNaN(d)?String(s):d.toLocaleDateString([], {month:"short",day:"numeric"}); }

/* zone matching, same rules as the server so a wrong tag is caught on the phone */
function zNorm(s){ return String(s==null?"":s).toUpperCase().replace(/\s+/g,"").replace(/^ZONE[:|]/,""); }
function zoneOk(scan,z){
  const s=zNorm(scan); if(!s||!z) return false;
  if((z.codes||[]).indexOf(s)>=0) return true;
  const m=/^([A-Z]+\d*-)(\d+)$/.exec(s); if(!m) return false;
  const n=+m[2], r=z.ranges||[];
  for(let i=0;i<r.length;i++) if(r[i].p===m[1]&&n>=r[i].a&&n<=r[i].b) return true;
  return (z.any||[]).indexOf(m[1])>=0;
}
const scanPass = (code,z) => !cfg().qrRequired || zoneOk(code,z);

/* complete: count gate first, then the zone scan the server requires, then one save */
async function doComplete(t){
  const s=t.session, fin=finishVal()==="yes", qty=$("fQty").value.trim(), unit=$("fUnit").value;
  if(t.requiresCount && fin){
    const n=Number(qty);
    if(qty===""||!isFinite(n)||n<=0){ toast("Enter a quantity greater than 0 to finish.",true); $("fQty").focus(); return; }
    if(!unit){ toast("Choose a unit.",true); return; }
  }
  if(!confirm((fin?"Finish ":"Save partial work on ")+t.name+"? This goes to the permanent log.")) return;
  const submit=async scan=>{
    S.busy=true;
    try{
      const cond={soilMoisture:$("fMoist").value,weather:$("fWeather").value,tempF:$("fTemp").value};
      const equip=$("fEquip").value.trim();
      if(equip||cond.soilMoisture||cond.weather||cond.tempF) await send("updateSession",{sessionId:s.id,equipment:equip||undefined,conditions:cond});
      const inputs=$("fInputs").value.trim(), notes=[$("fNotes").value.trim(), inputs?"Inputs: "+inputs:""].filter(Boolean).join(" | ");
      const body={sessionId:s.id,completed:fin,quantity:qty===""?"":Number(qty),unit:qty===""?"":unit,notes,zoneScan:scan?scan.code:"",scanMode:scan?scan.mode:"qr"};
      const r=await send("wClose",body,()=>{ S.hide[t.key]=true; });
      try{ localStorage.removeItem(draftKey(t.key)); }catch(e){}
      delete S.zone[t.key]; closeSessionScreen();
      if(r.queued){ renderTasks(); renderBadge(); } else { await refresh(); toast("Saved to the log"+(r.netMin!=null?": "+r.netMin+" min worked":"")); }
    }catch(e){ toast(e.message,true); }
    S.busy=false;
  };
  if(!cfg().qrRequired){ await submit(null); return; }
  openScanner({title:"Scan "+(t.zone?t.zone.label:"zone")+" to submit",hint:"The server needs the zone tag to accept this task.",allowTyped:typedOk(),zone:t.zone,
    onCode:(code,mode)=>{
      if(!scanPass(code,t.zone)) return {ok:false,msg:"That is not "+(t.zone?t.zone.label:"this zone")+"."};
      return {ok:true,close:true,value:{code,mode}};
    },
    onDone:v=>{ if(v) submit(v); }});
}

/* ============================ TRAYS ============================ */
const TRAY_RE=/^TRAY\|([A-Za-z0-9-]+)\|W(\d+)\|(\d+)$/;
function trayRun(){ const T=S.tray; if(!T.codes.length) return null; const m=TRAY_RE.exec(T.codes[0]); return m?(S.data.runs||[]).find(r=>r.runId===m[1]):null; }
function trayWave(){ const m=S.tray.codes.length?TRAY_RE.exec(S.tray.codes[0]):null; return m?+m[2]:0; }
function renderTrays(){
  const T=S.tray, box=$("trayBox"), run=trayRun(), wave=trayWave();
  let h="";
  if(T.res){
    h+='<div class="card live-card"><h3>Move saved</h3><div class="meta">'+T.res.logged+' tray'+(T.res.logged===1?"":"s")+' logged'+(T.res.duplicates?', '+T.res.duplicates+' already logged':'')+'.</div>'
      +(T.res.rejected&&T.res.rejected.length?'<div class="hint">Rejected: '+T.res.rejected.map(x=>esc(x.code)+" ("+esc(x.why)+")").join("; ")+'</div>':'')
      +'<div style="margin-top:10px"><button class="btn go" id="trNew">Move more trays</button></div></div>';
    box.innerHTML=h; return;
  }
  h+='<div class="card"><div class="meta">Scan each tray tag, then scan the planting zone. Typing a tray code works if the camera fails.</div></div>';
  if(run){
    h+='<div class="card"><h3>'+esc(run.cropName)+' · wave '+wave+'</h3><div class="meta">'+esc(run.runId)+' · '+T.codes.length+' of '+(run.traysPerWave||"?")+' trays scanned</div>'
      +(run.nursery?'':'<div class="hint" style="color:var(--warn)">This run has no nursery trays, so it cannot be moved here.</div>')
      +'<div style="margin-top:8px">'+T.codes.slice(-6).reverse().map(c=>'<div class="trayrow"><span>'+esc(c)+'</span><button class="btn ghost sm" data-rm="'+esc(c)+'" style="min-height:40px">Remove</button></div>').join("")+'</div>'
      +(T.codes.length>6?'<div class="hint">Showing the last 6.</div>':'')+'</div>';
  }
  h+='<div class="controls"><button class="btn done" id="trScan">'+(T.codes.length?"Scan more trays":"Scan trays")+'</button>'
    +'<div class="loc"><input class="t" id="trTyped" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="TRAY|R-xxxxxxxx|W1|01"><button class="btn ghost sm" id="trAdd">Add</button></div></div>';
  if(run&&run.nursery&&T.codes.length){
    const ok=!cfg().qrRequired||!!T.dest;
    h+='<div class="zone '+(ok?"ok":"")+'"><div class="meta">Destination zone</div><div class="zl">'+esc(run.zone?run.zone.label:"")+'</div><div class="hint">'+(!cfg().qrRequired?"Zone scan is optional right now.":T.dest?"Zone confirmed: "+esc(T.dest.code):"Scan the planting zone tag.")+'</div>'
      +'<div style="margin-top:10px"><button class="btn done sm" id="trDest">'+(T.dest?"Scan again":"Scan zone tag")+'</button></div></div>'
      +'<button class="btn go" id="trSubmit"'+(ok?"":" disabled")+'>Move '+T.codes.length+' tray'+(T.codes.length===1?"":"s")+'</button>';
  }
  if(T.bad.length) h+='<div class="hint" style="margin-top:10px;color:var(--warn)">'+T.bad.map(esc).join("<br>")+'</div>';
  box.innerHTML=h;
}
function addTray(code){
  const T=S.tray, c=String(code).trim(), m=TRAY_RE.exec(c);
  if(!m) return {ok:false,msg:"Not a tray tag: "+c};
  if(T.codes.length){ const f=TRAY_RE.exec(T.codes[0]); if(f[1]!==m[1]||f[2]!==m[2]) return {ok:false,msg:"Different run or wave. Finish this move first."}; }
  const run=(S.data.runs||[]).find(r=>r.runId===m[1]); if(!run) return {ok:false,msg:"Run "+m[1]+" is not on this phone yet. Refresh."};
  if(+m[3]<1||+m[3]>(run.traysPerWave||0)) return {ok:false,msg:"Tray "+m[3]+" is outside this run."};
  if(T.codes.includes(c)) return {ok:true,msg:"Already scanned"};
  T.codes.push(c); T.cid=T.cid||("c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)); return {ok:true,msg:"Tray "+m[3]+" added"};
}
$("trayBox").addEventListener("click",e=>{
  const T=S.tray, id=e.target.id;
  if(id==="trNew"){ S.tray={codes:[],bad:[],dest:null,cid:null,res:null}; renderTrays(); return; }
  const rm=e.target.closest("[data-rm]"); if(rm){ T.codes=T.codes.filter(c=>c!==rm.dataset.rm); if(!T.codes.length){T.dest=null;T.cid=null;} renderTrays(); return; }
  if(id==="trAdd"){ const v=$("trTyped").value.trim(); if(!v) return; const r=addTray(v); if(!r.ok) toast(r.msg,true); $("trTyped").value=""; renderTrays(); return; }
  if(id==="trScan"){
    openScanner({title:"Scan tray tags",hint:"Keep scanning. Tap Done when every tray is in.",multi:true,allowTyped:false,
      onCode:code=>addTray(code),onDone:()=>renderTrays()}); return;
  }
  if(id==="trDest"){
    const run=trayRun();
    openScanner({title:"Scan "+(run&&run.zone?run.zone.label:"planting zone"),hint:"Point at the planting zone tag.",allowTyped:typedOk(),zone:run&&run.zone,
      onCode:(code,mode)=>{ if(!scanPass(code,run&&run.zone)) return {ok:false,msg:"That does not match "+(run&&run.zone?run.zone.label:"the zone")+"."}; T.dest={code,mode}; return {ok:true,close:true}; },
      onDone:()=>renderTrays()}); return;
  }
  if(id==="trSubmit") submitTrays();
});
async function submitTrays(){
  const T=S.tray, run=trayRun(); if(!run||S.busy) return; S.busy=true;
  try{
    const r=await send("wTray",{runId:run.runId,wave:trayWave(),trays:T.codes,toScan:T.dest?T.dest.code:"",toMode:T.dest?T.dest.mode:"qr",cid:T.cid});
    if(r.queued){ S.tray={codes:[],bad:[],dest:null,cid:null,res:{logged:T.codes.length,duplicates:0,rejected:[]}}; }
    else S.tray={codes:[],bad:[],dest:null,cid:null,res:{logged:r.logged,duplicates:r.duplicates,rejected:r.rejected}};
    renderTrays(); toast("Tray move saved");
  }catch(e){ toast(e.message,true); }
  S.busy=false;
}

/* ============================ SCANNER ============================ */
let detector=null;
function openScanner(opts){
  S.sc=opts; $("scTitle").textContent=opts.title; $("scHint").textContent=opts.hint||""; $("camMsg").textContent="Point at the tag";
  $("scTypedRow").classList.toggle("hidden",!opts.allowTyped); if(opts.allowTyped) fillZonePick();
  const f=$("scFound"); f.classList.toggle("hidden",!opts.multi); f.textContent="";
  $("scClose").textContent=opts.multi?"Done":"Cancel";
  $("scanner").classList.remove("hidden"); document.body.style.overflow="hidden";
  startCam();
}
function closeScanner(value){
  const o=S.sc; S.sc=null; stopCam(); $("scanner").classList.add("hidden");
  document.body.style.overflow = $("session").classList.contains("hidden") ? "" : "hidden";
  if(o&&o.onDone) o.onDone(value);
}
$("scClose").onclick=()=>closeScanner(undefined);
async function handleScan(code,mode){
  const o=S.sc; if(!o) return;
  const r=o.onCode(code,mode)||{ok:false};
  if(o.multi){
    const f=$("scFound"); f.textContent=r.msg||""; f.classList.remove("hidden");
    $("camMsg").textContent=r.msg||""; return;
  }
  if(r.ok&&r.close){ closeScanner(r.value); return; }
  $("camMsg").textContent=r.msg||"Try again";
}
/* No camera: the worker confirms the zone this task needs, picked from a one-item list instead of typing its code. It is logged as a manual entry. */
let ZC=[];
function fillZonePick(){
  const z=S.sc&&S.sc.zone; ZC=z&&z.label&&(z.codes||[]).length?[z]:[];
  $("scPick").innerHTML=ZC.map((x,i)=>'<option value="'+i+'">'+esc(x.label)+'</option>').join("");
}
function pickGo(){ const i=$("scPick").value; if(i==="") return; handleScan(ZC[+i].codes[0],"manual"); }
$("scTypedGo").onclick=pickGo;

async function startCam(){
  stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ $("camMsg").textContent=typedOk()?"No camera here. Choose the zone below.":"No camera here. Choosing a zone by hand is turned off. Ask a manager."; return; }
  try{ S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}); }
  catch(e){ $("camMsg").textContent=typedOk()?"Camera blocked. Choose the zone below.":"Camera blocked. Allow camera access in the browser."; return; }
  if(!S.sc){ stopCam(); return; }
  const v=$("vid"); v.srcObject=S.stream; await v.play().catch(()=>{}); S.scanOn=true;
  if("BarcodeDetector" in window){ try{ detector=new BarcodeDetector({formats:["qr_code","code_128","code_39","data_matrix"]}); }catch(e){ detector=null; } }
  scanLoop();
}
function stopCam(){ S.scanOn=false; if(S.stream){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; } }
let lastCode="",lastAt=0;
async function scanLoop(){
  if(!S.scanOn||!S.sc) return;
  const v=$("vid"); let code=null;
  try{
    if(detector){ const r=await detector.detect(v); if(r.length) code=r[0].rawValue; }
    else if(window.jsQR && v.videoWidth){
      const cv=scanLoop.cv||(scanLoop.cv=document.createElement("canvas")), w=Math.min(640,v.videoWidth), h=Math.round(w*v.videoHeight/v.videoWidth);
      cv.width=w; cv.height=h; const x=cv.getContext("2d",{willReadFrequently:true}); x.drawImage(v,0,0,w,h);
      const q=jsQR(x.getImageData(0,0,w,h).data,w,h); if(q) code=q.data;
    }
  }catch(e){}
  if(code && (code!==lastCode || Date.now()-lastAt>2500)){ lastCode=code; lastAt=Date.now(); await handleScan(code,"qr"); }
  if(S.scanOn&&S.sc) setTimeout(scanLoop,detector?200:250);
}

/* ============================ TOAST ============================ */
let tt; function toast(msg,bad){ const t=$("toast"); t.textContent=msg; t.className=bad?"bad":""; clearTimeout(tt); tt=setTimeout(()=>t.classList.add("hidden"),bad?4800:2400); }

/* ============================ INIT ============================ */
if(loadAuth()) enterApp(); else setLive(false);
</script>
